<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=3' | relative_url }}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        const storedTheme = localStorage.getItem('theme') || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (storedTheme)
            document.documentElement.setAttribute('data-theme', storedTheme)
    </script>
</head>

<body>

    <header class="site-header">
        <div class="wrapper">
            <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <nav class="site-nav">
                <a href="{{ '/' | relative_url }}" class="page-link">About</a>
                <a href="{{ '/research' | relative_url }}" class="page-link">Research</a>
                <a href="{{ '/publications' | relative_url }}" class="page-link">Publications</a>
                <a href="{{ '/paper-review' | relative_url }}" class="page-link">Paper Reviews</a>
                <a href="{{ '/cv' | relative_url }}" class="page-link">CV</a>
                <a href="{{ '/contact' | relative_url }}" class="page-link">Contact</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
                    <span class="icon-moon">🌙</span>
                    <span class="icon-sun" style="display:none;">☀️</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="page-content" aria-label="Content">
        <div class="wrapper">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrapper">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Powered by Jekyll.</p>
        </div>
    </footer>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const iconMoon = document.querySelector('.icon-moon');
        const iconSun = document.querySelector('.icon-sun');

        // Function to update the icons based on the current theme
        const updateIcons = (theme) => {
            if (theme === 'light') {
                iconMoon.style.display = 'none';
                iconSun.style.display = 'inline';
            } else {
                iconMoon.style.display = 'inline';
                iconSun.style.display = 'none';
            }
        };

        // Initialize icons on page load
        const currentTheme = document.documentElement.getAttribute('data-theme');
        updateIcons(currentTheme);

        // Toggle functionality
        themeToggle.addEventListener('click', () => {
            let targetTheme = 'light';
            let currentTheme = document.documentElement.getAttribute("data-theme");

            if (currentTheme === "light") {
                targetTheme = "dark";
            }

            document.documentElement.setAttribute('data-theme', targetTheme)
            localStorage.setItem('theme', targetTheme);
            updateIcons(targetTheme);
        });

        window.SITE_REFERENCES = {{ site.data.references | jsonify }};

        document.addEventListener('DOMContentLoaded', () => {
            const citeRefs = document.querySelectorAll('.cite-ref');
            if (citeRefs.length === 0) return;

            const citedKeys = [];
            const keyToNum = {};

            citeRefs.forEach(el => {
                const key = el.getAttribute('data-key');
                if (!keyToNum[key]) {
                    citedKeys.push(key);
                    keyToNum[key] = citedKeys.length;
                }
                const num = keyToNum[key];
                el.innerHTML = `<sup><a href="#ref-${num}" id="cite-link-${num}">[${num}]</a></sup>`;
            });

            const mainWrapper = document.querySelector('.page-content .wrapper');
            if (mainWrapper && citedKeys.length > 0) {
                const refSection = document.createElement('div');
                refSection.className = 'references-section';
                refSection.innerHTML = `
                    <hr style="margin-top: 40px; border: 0; border-top: 1px solid var(--pub-bg);">
                    <h2>References</h2>
                    <ol class="references-list" style="padding-left: 20px;">
                        ${citedKeys.map(key => {
                            const num = keyToNum[key];
                            const ref = window.SITE_REFERENCES ? window.SITE_REFERENCES[key] : null;
                            if (!ref) return `<li id="ref-${num}">[${key}] Reference details missing.</li>`;
                            const doiHtml = ref.doi ? ` <a href="${ref.doi}" target="_blank" rel="noopener">[DOI]</a>` : '';
                            return `<li id="ref-${num}" style="margin-bottom: 8px;">
                                ${ref.authors} (${ref.year}). "${ref.title}". <em>${ref.journal}</em>, ${ref.volume}${ref.number ? '(' + ref.number + ')' : ''}, ${ref.pages}.${doiHtml}
                            </li>`;
                        }).join('')}
                    </ol>
                `;
                mainWrapper.appendChild(refSection);
            }
        });
    </script>

</body>

</html>
