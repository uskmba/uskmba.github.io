- title: "간헐 기어를 이용한 냉장고 문의 자동 완전 개폐 메커니즘"
  description: "한국산학기술학회논문지 (2024). 모터의 회전력을 효율적으로 변환하여 초기 저항을 극복하고 냉장고 문을 부드럽게 완전 개폐할 수 있도록 설계된 간헐 기어(Missing Teeth Gear) 메커니즘 연구."
