- title: "Design of Planar Permanent Magnet Array for Remotely Actuated Magnetic Micro Robots"
  description: "Journal of Magnetics (2024). Proposes an open-type planar permanent magnet array design to optimize magnetic force gradients and enable stable central trapping for remotely actuated microrobots."
